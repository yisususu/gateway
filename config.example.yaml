# BooMGateway 配置文件
# 兼容 litellm 的 proxy_server_config.yaml 格式
# model 字段使用 litellm 的 provider/model-id 前缀约定

model_list:
  # OpenAI — 显式前缀
  - model_name: gpt-4
    litellm_params:
      model: openai/gpt-4-turbo
      api_key: os.environ/OPENAI_API_KEY

  # OpenAI — 自动检测 (gpt- 开头自动识别为 openai)
  - model_name: gpt-4o
    litellm_params:
      model: gpt-4o
      api_key: ${OPENAI_API_KEY}

  # Anthropic
  - model_name: claude-3
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  # Azure OpenAI
  - model_name: azure-gpt4
    litellm_params:
      model: azure/my-gpt4-deployment
      api_base: https://YOUR_RESOURCE.openai.azure.com
      api_key: os.environ/AZURE_API_KEY
      api_version: "2024-02-01"

  # Gemini
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

general_settings:
  # Master key — 不走 DB 也能鉴权
  master_key: os.environ/MASTER_KEY
  # 连接 litellm 同一个 PostgreSQL，直接读取 LiteLLM_VerificationToken 表
  database_url: os.environ/DATABASE_URL

router_settings:
  routing_strategy: round_robin

# 以下为 BooMGateway 扩展配置，litellm 不认识会被忽略
server:
  host: 0.0.0.0
  port: 4000
  workers: 4

rate_limit:
  enabled: true
  default_rpm: 60
  # 自定义时间窗口: [次数, 秒数]
  # 示例: 每 5 小时 100 次
  window_limits:
    - [100, 18000]
